name: Perbarui manifest

# Setiap ada rilis baru (dibuat oleh workflow di repo aplikasi), susun ulang
# apps/<id>.json supaya updater di aplikasi melihat versi terbaru.
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Susun manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_manifests.py

      - name: Commit kalau ada perubahan
        run: |
          if git diff --quiet -- apps; then
            echo "Manifest tidak berubah."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "Perbarui manifest"
          git push
