name: Rilis APK

# Template untuk repo aplikasi (boleh privat). Salin ke .github/workflows/release.yml
# lalu ganti APP_ID dan RELEASE_SHA1.
#
# Dorong tag vX.Y.Z, sisanya jalan sendiri: build, tanda tangani, lalu rilis
# ke repo publik Irana06/shicomp-apps dengan tag <APP_ID>-vX.Y.Z.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Jalankan manual lewat tab Actions untuk sekadar uji build tanpa membuat rilis.
#
# Secret di Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64  isi <app>-release.jks dalam base64
#   STORE_PASSWORD   sandi keystore
#   KEY_PASSWORD     sandi kunci
#   KEY_ALIAS        alias kunci
#   HUB_TOKEN        fine-grained token, akses "Contents: Read and write"
#                    HANYA untuk repo Irana06/shicomp-apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: namaapp
  HUB_REPO: Irana06/shicomp-apps
  FLUTTER_VERSION: 3.47.7
  # Sidik jari sertifikat rilis. Kalau beda, keystore-nya salah dan APK
  # tidak akan bisa dipasang di atas versi yang sudah ada di HP.
  RELEASE_SHA1: ganti-dengan-sha1-keystore

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Fail in seconds instead of after a ten-minute build when HUB_TOKEN is wrong.
      - name: Check hub token
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret HUB_TOKEN is empty."
            exit 1
          fi
          echo "HUB_TOKEN length: ${#GH_TOKEN}, starts with github_pat_: $([[ $GH_TOKEN == github_pat_* ]] && echo yes || echo no)"
          if ! gh api "repos/$HUB_REPO" --jq .full_name; then
            echo "::error::HUB_TOKEN cannot read $HUB_REPO. Create a fine-grained token with Contents read and write on that repo and set it again."
            exit 1
          fi

      - name: Ambil dependensi
        run: flutter pub get

      - name: Cocokkan versi pubspec dengan tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)
          echo "tag=$TAG pubspec=$PUBSPEC"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG tidak sama dengan versi di pubspec.yaml ($PUBSPEC)."
            exit 1
          fi

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > android/key.properties

      - name: Analisis
        run: flutter analyze --no-fatal-infos

      - name: Tes
        run: flutter test

      - name: Build APK per ABI
        run: flutter build apk --release --split-per-abi

      - name: Periksa tanda tangan
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SHA1=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i 'SHA-1 digest' | awk '{print $NF}')
          echo "sidik jari: $SHA1"
          if [ "$SHA1" != "$RELEASE_SHA1" ]; then
            echo "::error::APK ditandatangani kunci yang salah."
            exit 1
          fi

      # Pola nama <id>-v<versi>-<abi>.apk dibaca oleh scripts/build_manifests.py di hub.
      - name: Beri nama berkas sesuai pola hub
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "release/$APP_ID-v$VERSION-$abi.apk"
          done
          ls -la release

      - name: Susun catatan rilis
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" notes.md; else git log -1 --format=%B > notes.md; fi

      - name: Simpan APK sebagai artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-apk
          path: release/*.apk

      # Rilis dibuat dengan HUB_TOKEN (bukan GITHUB_TOKEN) supaya workflow
      # manifests.yml di hub ikut terpicu dan apps/<id>.json diperbarui.
      - name: Rilis ke hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          gh release create "$APP_ID-$GITHUB_REF_NAME" release/*.apk \
            --repo "$HUB_REPO" \
            --title "$APP_ID $GITHUB_REF_NAME" \
            --notes-file notes.md
